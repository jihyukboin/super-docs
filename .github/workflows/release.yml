name: Release macOS

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-production-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'dev' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      SIGNING_IDENTITY: 'Developer ID Application: IMGOBOT (KTGYAM53PK)'
      NOTARY_PROFILE: super-docs-notary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Select release version
        id: version
        run: python3 scripts/prepare-release.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.version.outputs.skip != 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: npm ci
      - name: Import signing and notarization credentials
        if: steps.version.outputs.skip != 'true'
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/super-docs-signing"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for name in ('CERTIFICATE_P12_BASE64', 'CERTIFICATE_PASSWORD', 'NOTARY_PASSWORD', 'SPARKLE_PRIVATE_KEY'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing release secret: {name}')
          root = Path(os.environ['RUNNER_TEMP']) / 'super-docs-signing'
          (root / 'certificate.p12').write_bytes(base64.b64decode(os.environ['CERTIFICATE_P12_BASE64'], validate=True))
          (root / 'sparkle.key').write_text(os.environ['SPARKLE_PRIVATE_KEY'])
          PY
          keychain="$RUNNER_TEMP/super-docs-signing/build.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/super-docs-signing/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" --keychain "$keychain" \
            --apple-id jihyukboin@icloud.com --team-id KTGYAM53PK --password "$NOTARY_PASSWORD"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SPARKLE_KEY_FILE=$RUNNER_TEMP/super-docs-signing/sparkle.key" >> "$GITHUB_ENV"
      - name: Build, sign, notarize and generate Sparkle appcast
        if: steps.version.outputs.skip != 'true'
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/release-macos.sh
      - name: Publish immutable release and update feed
        if: steps.version.outputs.skip != 'true'
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/publish-release.sh
      - name: Remove temporary signing credentials
        if: always()
        run: |
          keychain="$RUNNER_TEMP/super-docs-signing/build.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi
          rm -rf "$RUNNER_TEMP/super-docs-signing"
